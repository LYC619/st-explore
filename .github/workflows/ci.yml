name: CI

# No installers, signing or publishing. Rust uses the local desktop target OS.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify web
        run: npm run verify:web
      # Uses the built dist; does not run Gradle or produce an APK.
      - name: Capacitor sync (android)
        run: npx cap sync android

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      # Tauri embeds frontend assets even for library tests.
      - name: Prepare frontend assets
        run: npm run build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Rust lint
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings
